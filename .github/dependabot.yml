version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    groups:
      react:
        patterns: ["react", "react-dom", "@types/react", "@types/react-dom"]
      tooling:
        patterns: ["vite", "@vitejs/*", "typescript", "@types/node"]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
